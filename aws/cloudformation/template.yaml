AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Digital Twin FM - Serverless SaaS Infrastructure

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]

Globals:
  Function:
    Runtime: python3.11
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment

Resources:
  # DynamoDB Tables
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: dtfm-users
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  TenantDataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: dtfm-tenant-data
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  SensorReadingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: dtfm-sensor-readings
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  # S3 Buckets
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub dtfm-frontend-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*

  UserDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub dtfm-user-data-${AWS::AccountId}
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST]
            AllowedOrigins: ['*']
            MaxAge: 3600

  # Lambda IAM Role
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dtfm-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: dtfm-lambda-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:*
                Resource:
                  - !GetAtt UsersTable.Arn
                  - !GetAtt TenantDataTable.Arn
                  - !GetAtt SensorReadingsTable.Arn
              - Effect: Allow
                Action: s3:*
                Resource:
                  - !GetAtt UserDataBucket.Arn
                  - !Sub ${UserDataBucket.Arn}/*
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: 'arn:aws:secretsmanager:us-east-1:976193236457:secret:opencrm/frappe-api-key-iQgSaZ'

  # Lambda Functions
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dtfm-auth
      CodeUri: ../lambda/
      Handler: auth.lambda_handler
      Role: !GetAtt LambdaRole.Arn
      ReservedConcurrentExecutions: 5
      Events:
        Register:
          Type: Api
          Properties:
            Path: /auth/register
            Method: POST
            RestApiId: !Ref ApiGateway
        Login:
          Type: Api
          Properties:
            Path: /auth/login
            Method: POST
            RestApiId: !Ref ApiGateway
        Verify:
          Type: Api
          Properties:
            Path: /auth/verify
            Method: POST
            RestApiId: !Ref ApiGateway

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dtfm-api
      CodeUri: ../lambda/
      Handler: api.lambda_handler
      Role: !GetAtt LambdaRole.Arn
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          USER_DATA_BUCKET: !Ref UserDataBucket
      Events:
        ApiProxy:
          Type: Api
          Properties:
            Path: /api/{proxy+}
            Method: ANY
            RestApiId: !Ref ApiGateway

  AiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dtfm-ai
      CodeUri: ../lambda/
      Handler: ai_service.lambda_handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 60
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          BEDROCK_MODEL: anthropic.claude-3-haiku-20240307-v1:0
          AI_DAILY_LIMIT: '25'
          USAGE_TABLE: dtfm-tenant-data
      Events:
        AiQuery:
          Type: Api
          Properties:
            Path: /ai/query
            Method: POST
            RestApiId: !Ref ApiGateway

  # API Gateway
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: dtfm-api
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      MethodSettings:
        # Global cap for the whole stage: 20 req/s burstable to 40 (SaaS demo)
        - HttpMethod: '*'
          ResourcePath: '/*'
          ThrottlingBurstLimit: 40
          ThrottlingRateLimit: 20
        # The ONLY paid path (Bedrock Claude): tight 2 req/s / burst 5
        - HttpMethod: POST
          ResourcePath: /ai/query
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2

  # CloudFront Distribution
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          MinTTL: 0
          DefaultTTL: 86400
          MaxTTL: 31536000
        CustomErrorResponses:
          - ErrorCode: 404
            ResponsePagePath: /index.html
            ResponseCode: 200
            ErrorCachingMinTTL: 300
          - ErrorCode: 403
            ResponsePagePath: /index.html
            ResponseCode: 200
            ErrorCachingMinTTL: 300

Outputs:
  ApiUrl:
    Value: !Sub https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
  CloudFrontUrl:
    Value: !GetAtt CloudFrontDistribution.DomainName
  FrontendBucket:
    Value: !Ref FrontendBucket
  UserDataBucket:
    Value: !Ref UserDataBucket
