# Digital Twin FM — Local dev infrastructure
# Build images first:
#   docker build -f docker/web.Dockerfile -t dtfm-web .
#   docker build -f docker/api-gateway.Dockerfile -t dtfm-api .
#   docker build -f docker/ingestion-service.Dockerfile -t dtfm-ingestion .
#   docker build -f docker/ai-service.Dockerfile -t dtfm-ai .
#
# Then: docker compose up

services:
  # ── Infrastructure ────────────────────────────────────────────

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: dtfm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dtfm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-dtfm_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-dtfm_user}", "-d", "${POSTGRES_DB:-dtfm_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: dtfm-valkey
    restart: unless-stopped
    command:
      - valkey-server
      - --save
      - "60 1"
      - --loglevel
      - warning
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --bind
      - 0.0.0.0
    volumes:
      - valkey_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: dtfm-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  # ── App services ──────────────────────────────────────────────

  db-migrate:
    build:
      context: .
      dockerfile: docker/db-migrate.Dockerfile
    image: dtfm-db-migrate
    container_name: dtfm-db-migrate
    command: ["node", "migrate.mjs"]
    restart: "no"
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-dtfm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-dtfm_db}
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: docker/api-gateway.Dockerfile
    image: dtfm-api
    container_name: dtfm-api
    restart: unless-stopped
    command: ["node", "dist/main.js"]
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      MVP_ADMIN_PASSWORD: ${MVP_ADMIN_PASSWORD:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-dtfm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-dtfm_db}
      POSTGRES_SSL: "false"
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      AI_SERVICE_URL: http://ai:8000
      MQTT_URL: mqtt://mosquitto:1883
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      ai:
        condition: service_healthy
    volumes:
      - api-uploads:/app/apps/api-gateway/uploads

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_OUTPUT: standalone
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    image: dtfm-web
    container_name: dtfm-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_OUTPUT: standalone
      API_GATEWAY_URL: http://api-gateway:4000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api-gateway

  ingestion:
    build:
      context: .
      dockerfile: docker/ingestion-service.Dockerfile
    image: dtfm-ingestion
    container_name: dtfm-ingestion
    restart: unless-stopped
    ports:
      - "127.0.0.1:4100:4100"
    environment:
      NODE_ENV: production
      INGESTION_HOST: 0.0.0.0
      INGESTION_PORT: 4100
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      MQTT_URL: mqtt://mosquitto:1883
      INGESTION_LOG_LEVEL: info
    depends_on:
      valkey:
        condition: service_healthy
      mosquitto:
        condition: service_started

  ai:
    build:
      context: .
      dockerfile: docker/ai-service.Dockerfile
    image: dtfm-ai
    container_name: dtfm-ai
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AI_HOST: 0.0.0.0
      AI_SERVICE_PORT: 8000
      PYTHONUNBUFFERED: 1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LITELLM_MODEL: ${LITELLM_MODEL:-openai/deepseek-v4-flash-free}
      LITELLM_API_BASE: ${LITELLM_API_BASE:-https://opencode.ai/zen/v1}
      OPENCODE_ZEN_API_KEY: ${OPENCODE_ZEN_API_KEY:-}
      API_GATEWAY_URL: http://api-gateway:4000
      AI_CORS_ORIGIN: ${AI_CORS_ORIGIN:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Sensor data generator ──────────────────────────────────
  # Keeps sensor_readings fresh so time-windowed features
  # (predictive health scores, live monitoring, dashboards)
  # never go blank. Without this, seed data ages out after 2h and
  # the predictive tab shows "Insufficient data" for every asset.
  simulator:
    build:
      context: .
      dockerfile: docker/simulator.Dockerfile
    image: dtfm-simulator
    container_name: dtfm-simulator
    restart: unless-stopped
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-dtfm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-dtfm_db}
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    command: ["sh", "-c", "corepack enable && pnpm --filter @digital-twin-fm/db exec tsx src/simulator.ts run"]

  # Caddy reverse proxy (recommended for staging/prod / public VM / EC2).
  # Disabled by default via `profiles: [proxy]` so a plain `docker compose up -d`
  # skips it. Enable AFTER your DNS A-record points at this host, then:
  #   docker compose --profile proxy up -d caddy
  # Caddy auto-issues Let's Encrypt TLS using the Caddyfile at repo root.
  # It reaches web/api-gateway by their COMPOSE SERVICE NAMES (not localhost),
  # because Caddy runs on the same Docker network as those containers.
  caddy:
    profiles: ["proxy"]
    image: caddy:2
    container_name: dtfm-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api-gateway

volumes:
  postgres_data:
  valkey_data:
  mosquitto_data:
  mosquitto_log:
  api-uploads:
  caddy_data:
  caddy_config:
